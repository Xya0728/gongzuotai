<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>手机布局测试（390 宽）</title>
  <style>
    html, body { margin: 0; background: #fff; }
    iframe { width: 390px; height: 844px; border: 0; display: block; }
    #results { margin: 0; font: 11px/1.5 Menlo, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <iframe id="frame" src="mobile.html"></iframe>
  <pre id="results">running…</pre>
  <script>
    window.addEventListener('message', function (event) {
      if (!event.data || event.data.type !== 'xya-mobile-results') return;
      document.getElementById('results').textContent = event.data.text;
    });
  </script>
</body>
</html>
